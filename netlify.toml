# Netlify hosts the browser/PWA client only. The optional report API can be
# deployed separately later; device saves and backup import/export work without it.
[build]
  command = "pnpm exec vite build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22.13.0"

# Always revalidate the service worker so deployed UI updates reach field devices.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
